<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172e2b">
  <meta name="description" content="A simple daily calorie total, with additions, corrections, and multipliers.">
  <title>Calorie Tracker</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #19332d; background: #f3f5ed; font-size: 16px; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 90% 0, #e0edda 0, transparent 35%), #f3f5ed; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .shell { max-width: 800px; margin: 0 auto; padding: 34px 22px 76px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 29px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 1.12rem; font-weight: 800; letter-spacing: -.025em; }
    .brand-mark { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 13px; background: #19332d; color: #d4ef91; font-size: 1.3rem; }
    .today-label { color: #597168; font-size: .9rem; font-weight: 650; text-align: right; }
    .today-card { background: #19332d; color: #fff; border-radius: 28px; padding: 34px 38px 35px; box-shadow: 0 18px 45px #19332d24; position: relative; overflow: hidden; }
    .today-card::after { content: ""; position: absolute; width: 190px; height: 190px; border: 32px solid #ffffff0a; border-radius: 50%; right: -72px; top: -72px; pointer-events: none; }
    .eyebrow { margin: 0 0 13px; color: #b9d7c8; font-size: .95rem; font-weight: 700; }
    .total { display: flex; align-items: baseline; gap: 13px; line-height: 1; font-variant-numeric: tabular-nums; }
    .total strong { font-size: clamp(4rem, 12vw, 6rem); letter-spacing: -.075em; font-weight: 760; overflow-wrap: anywhere; }
    .total span { color: #c1d9cd; font-size: 1.25rem; font-weight: 700; }
    .today-note { margin: 20px 0 0; color: #c1d9cd; font-size: .94rem; }
    .entry-card, .list-card { background: #fff; border: 1px solid #dbe6d8; border-radius: 22px; box-shadow: 0 8px 28px #19332d0a; }
    .entry-card { margin-top: 20px; padding: 26px 28px 22px; }
    h1, h2 { margin: 0; letter-spacing: -.035em; }
    h1 { font-size: 1.38rem; }
    h2 { font-size: 1.2rem; }
    .entry-form { margin-top: 20px; }
    .input-row { display: flex; align-items: stretch; gap: 9px; }
    .input-wrap { position: relative; flex: 1; min-width: 0; }
    .kcal-input { width: 100%; height: 56px; padding: 0 66px 0 17px; border: 2px solid #cbdbcd; border-radius: 13px; background: #fbfdf9; color: #19332d; outline: none; font-size: 1.18rem; font-variant-numeric: tabular-nums; }
    .kcal-input:focus { border-color: #4f9168; box-shadow: 0 0 0 3px #4f91682b; }
    .input-suffix { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #647b6e; pointer-events: none; }
    .multiplier { min-width: 64px; max-width: 110px; padding: 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 2px solid #cbdccd; border-radius: 13px; background: #f3faed; color: #225941; font-weight: 800; font-variant-numeric: tabular-nums; }
    .multiplier:hover { background: #e7f5da; }
    .multiplier:focus-visible, .action:focus-visible, .remove-button:focus-visible { outline: 3px solid #4f9168; outline-offset: 3px; }
    .actions { display: flex; gap: 10px; margin-top: 13px; }
    .action { flex: 1; min-height: 52px; border-radius: 12px; font-weight: 800; border: 0; }
    .add-button { background: #d4ef91; color: #19332d; }
    .add-button:hover { background: #c7e87b; }
    .subtract-button { background: #f3eee6; color: #714b32; border: 1px solid #eadccd; }
    .subtract-button:hover { background: #eee2d5; }
    .action:disabled, .multiplier:disabled { opacity: .5; cursor: not-allowed; }
    .preview { margin: 14px 0 0; color: #597168; font-size: .9rem; min-height: 1.4em; font-variant-numeric: tabular-nums; }
    .feedback { min-height: 1.3em; margin: 6px 0 0; color: #a23d32; font-size: .9rem; }
    .lists { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; align-items: start; }
    .list-card { padding: 23px 23px 13px; height: 286px; display: flex; flex-direction: column; min-height: 0; }
    .list-card h2 { margin-bottom: 17px; }
    .empty { color: #718579; line-height: 1.5; margin: 0 0 16px; font-size: .94rem; }
    .rows { list-style: none; padding: 0; margin: 0; flex: 1; min-height: 0; overflow-y: auto; overflow-anchor: none; scrollbar-gutter: stable; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid #e6ede5; padding: 13px 0; }
    .row-main { min-width: 0; }
    .row-title { display: block; font-weight: 750; line-height: 1.3; font-variant-numeric: tabular-nums; }
    .row-sub { display: block; color: #718579; font-size: .84rem; margin-top: 3px; }
    .row-side { display: flex; align-items: center; gap: 5px; }
    .history-total { white-space: nowrap; font-weight: 800; font-variant-numeric: tabular-nums; }
    .negative { color: #a34d3c; }
    .remove-button { border: 0; background: transparent; color: #718579; width: 34px; height: 34px; border-radius: 9px; font-size: 1.25rem; line-height: 1; }
    .remove-button:hover { background: #fce8e5; color: #a23d32; }
    .file-warning { background: #fff3c7; border: 1px solid #ead481; border-radius: 16px; padding: 17px 20px; margin-bottom: 20px; line-height: 1.5; }
    .multiplier-dialog { width: min(380px, calc(100vw - 32px)); padding: 27px; border: 1px solid #dbe6d8; border-radius: 20px; box-shadow: 0 24px 70px #19332d45; color: #19332d; }
    .multiplier-dialog::backdrop { background: #10251cb3; }
    .multiplier-dialog h2 { margin-bottom: 16px; }
    .dialog-label { display: block; margin-bottom: 7px; font-weight: 700; }
    .dialog-input-row { display: flex; gap: 8px; }
    .dialog-input { flex: 1; min-width: 0; height: 52px; padding: 0 14px; border: 2px solid #cbdbcd; border-radius: 12px; outline: none; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
    .dialog-input:focus { border-color: #4f9168; box-shadow: 0 0 0 3px #4f91682b; }
    .dialog-step { width: 52px; height: 52px; border: 1px solid #cbdccd; border-radius: 12px; background: #f3faed; color: #225941; font-size: 1.12rem; font-weight: 800; }
    .dialog-step:hover:not(:disabled) { background: #e7f5da; }
    .dialog-step:disabled { opacity: .45; cursor: not-allowed; }
    .dialog-step:focus-visible { outline: 3px solid #4f9168; outline-offset: 3px; }
    .dialog-feedback { min-height: 1.25em; margin: 10px 0; color: #a23d32; font-size: .88rem; }
    .dialog-actions { display: flex; gap: 10px; }
    .dialog-actions button { flex: 1; min-height: 45px; border-radius: 11px; font-weight: 750; }
    .dialog-cancel { border: 1px solid #cbdccd; background: #fff; color: #476458; }
    .dialog-save { border: 0; background: #d4ef91; color: #19332d; }
    [hidden] { display: none !important; }
    @media (max-width: 650px) { .shell { padding: 20px 14px 44px; } .top { margin-bottom: 20px; } .today-card { padding: 27px 25px 29px; border-radius: 23px; } .entry-card { padding: 22px 20px 16px; } .lists { grid-template-columns: 1fr; gap: 14px; margin-top: 14px; } }
  </style>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="ui-app ui-app--calories">
  <main class="shell">
    <header class="top">
      <div class="brand"><span class="brand-mark ui-mark" aria-hidden="true">◉</span><span>Calorie Tracker</span></div>
      <time class="today-label" id="today-date"></time>
    </header>
    <p class="file-warning" id="file-warning" hidden>Open Calorie Tracker from the Project Hub or start its server to save entries.</p>

    <section class="today-card ui-hero" aria-labelledby="today-heading">
      <p class="eyebrow ui-kicker" id="today-heading">Calories today</p>
      <div class="total" aria-live="polite" aria-atomic="true"><strong id="total">0</strong><span>kcal</span></div>
      <p class="today-note" id="today-note">Add your first entry today.</p>
    </section>

    <section class="entry-card ui-surface" aria-labelledby="entry-heading">
      <h1 class="ui-title" id="entry-heading">Log calories</h1>
      <form class="entry-form" id="entry-form">
        <div class="input-row">
          <div class="input-wrap">
            <input class="kcal-input ui-input" id="kcal-input" type="number" min="1" max="100000" step="1" inputmode="numeric" aria-label="Calories" required disabled>
            <span class="input-suffix" aria-hidden="true">kcal</span>
          </div>
          <button class="multiplier" id="multiplier" type="button" aria-label="Edit multiplier, currently ×1" title="Set multiplier" disabled>×1</button>
        </div>
        <div class="actions">
          <button class="action add-button ui-action ui-action--primary" id="add-button" type="submit" data-operation="add" disabled>+ KCAL</button>
          <button class="action subtract-button ui-action ui-action--soft" id="subtract-button" type="submit" data-operation="subtract" disabled>− KCAL</button>
        </div>
      </form>
      <p class="preview" id="preview" aria-live="polite"></p>
      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    </section>

    <div class="lists">
      <section class="list-card ui-surface" aria-labelledby="entries-heading">
        <h2 class="ui-title" id="entries-heading">Today’s entries</h2>
        <p class="empty" id="entries-empty">No entries yet today.</p>
        <ul class="rows" id="entries-list"></ul>
      </section>
      <section class="list-card ui-surface" aria-labelledby="history-heading">
        <h2 class="ui-title" id="history-heading">Previous days</h2>
        <p class="empty" id="history-empty">Your previous days will appear here.</p>
        <ul class="rows" id="history-list"></ul>
      </section>
    </div>
  </main>

  <dialog class="multiplier-dialog ui-dialog" id="multiplier-dialog" aria-labelledby="multiplier-heading">
    <form id="multiplier-form">
      <h2 class="ui-title" id="multiplier-heading">Set multiplier</h2>
      <label class="dialog-label" for="multiplier-input">Multiplier</label>
      <div class="dialog-input-row">
        <input class="dialog-input ui-input" id="multiplier-input" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-describedby="multiplier-feedback">
        <button class="dialog-step" id="multiplier-up" type="button" aria-label="Increase multiplier">▲</button>
        <button class="dialog-step" id="multiplier-down" type="button" aria-label="Decrease multiplier">▼</button>
      </div>
      <p class="dialog-feedback" id="multiplier-feedback" role="alert"></p>
      <div class="dialog-actions">
        <button class="dialog-cancel ui-action ui-action--outline" id="multiplier-cancel" type="button">Cancel</button>
        <button class="dialog-save ui-action ui-action--primary" type="submit">Set multiplier</button>
      </div>
    </form>
  </dialog>

  <script>
    (() => {
      "use strict";
      const $ = id => document.getElementById(id);
      const dateFormatter = new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric" });
      const historyFormatter = new Intl.DateTimeFormat(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
      const timeFormatter = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" });
      const numberFormatter = new Intl.NumberFormat(undefined, { maximumFractionDigits: 10 });
      const localDay = (date = new Date()) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      const parseDay = day => { const [year, month, date] = day.split("-").map(Number); return new Date(year, month - 1, date); };
      const signedAmount = value => `${value < 0 ? "−" : "+"}${numberFormatter.format(Math.abs(value))}`;
      const delta = entry => entry.kcal * entry.multiplier * (entry.operation === "subtract" ? -1 : 1);
      const maxMultiplier = Math.floor(Number.MAX_SAFE_INTEGER / 100000);
      const fileMode = location.protocol === "file:";
      let entries = [];
      let multiplier = 1;
      let busy = false;
      const parseMultiplier = raw => {
        const value = raw.trim();
        return /^(?:\d+(?:[.,]\d*)?|[.,]\d+)$/.test(value) ? Number(value.replace(",", ".")) : NaN;
      };
      const validMultiplier = value => Number.isFinite(value) && value > 0 && value <= maxMultiplier;
      const stepMultiplier = (value, direction) => {
        const step = value > 1 || (value === 1 && direction > 0) ? 1 : 0.1;
        return Number((value + direction * step).toPrecision(15));
      };

      function updateStepButtons() {
        const value = parseMultiplier($("multiplier-input").value);
        $("multiplier-up").disabled = !validMultiplier(value) || !validMultiplier(stepMultiplier(value, 1));
        $("multiplier-down").disabled = !validMultiplier(value) || !validMultiplier(stepMultiplier(value, -1));
      }

      function adjustMultiplier(direction) {
        const value = parseMultiplier($("multiplier-input").value);
        if (!validMultiplier(value)) return;
        const next = stepMultiplier(value, direction);
        if (!validMultiplier(next)) return;
        $("multiplier-input").value = String(next);
        $("multiplier-feedback").textContent = "";
        updateStepButtons();
      }

      async function api(path, options) {
        const response = await fetch(path, { ...options, headers: { "Content-Type": "application/json" } });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Could not save your entries.");
        return result;
      }

      function updateMultiplier() {
        $("multiplier").textContent = `×${multiplier}`;
        $("multiplier").setAttribute("aria-label", `Edit multiplier, currently ×${multiplier}`);
        const kcal = Number($("kcal-input").value);
        $("preview").textContent = Number.isInteger(kcal) && kcal >= 1 && kcal <= 100000
          ? `${numberFormatter.format(kcal)} × ${multiplier} = ${numberFormatter.format(kcal * multiplier)} kcal`
          : "";
      }

      function setEnabled(enabled) {
        $("kcal-input").disabled = !enabled;
        $("multiplier").disabled = !enabled;
        $("add-button").disabled = !enabled;
        $("subtract-button").disabled = !enabled;
      }

      function render() {
        const today = localDay();
        const todaysEntries = entries.filter(entry => entry.day === today).sort((a, b) => b.created - a.created);
        const total = todaysEntries.reduce((sum, entry) => sum + delta(entry), 0);
        const entriesScroll = $("entries-list").scrollTop;
        const historyScroll = $("history-list").scrollTop;
        $("today-date").dateTime = today;
        $("today-date").textContent = dateFormatter.format(new Date());
        $("total").textContent = numberFormatter.format(total);
        $("today-note").textContent = todaysEntries.length ? `${todaysEntries.length} ${todaysEntries.length === 1 ? "entry" : "entries"} today` : "Add your first entry today.";

        $("entries-list").replaceChildren();
        $("entries-empty").hidden = todaysEntries.length > 0;
        todaysEntries.forEach(entry => {
          const li = document.createElement("li");
          li.className = "row";
          const main = document.createElement("div");
          main.className = "row-main";
          const title = document.createElement("span");
          title.className = `row-title${delta(entry) < 0 ? " negative" : ""}`;
          title.textContent = `${signedAmount(delta(entry))} kcal`;
          const sub = document.createElement("span");
          sub.className = "row-sub";
          sub.textContent = `${numberFormatter.format(entry.kcal)} × ${entry.multiplier} · ${timeFormatter.format(new Date(entry.created))}`;
          main.append(title, sub);
          const button = document.createElement("button");
          button.className = "remove-button";
          button.type = "button";
          button.textContent = "×";
          button.setAttribute("aria-label", `Remove ${entry.operation === "subtract" ? "subtraction" : "addition"} of ${Math.abs(delta(entry))} kcal`);
          button.disabled = fileMode;
          button.addEventListener("click", async () => {
            button.disabled = true;
            try {
              entries = (await api(`/api/entries/${encodeURIComponent(entry.id)}`, { method: "DELETE" })).entries;
              $("feedback").textContent = "";
              render();
            } catch (error) {
              $("feedback").textContent = error.message;
              button.disabled = false;
            }
          });
          li.append(main, button);
          $("entries-list").append(li);
        });

        const byDay = new Map();
        entries.filter(entry => entry.day !== today).forEach(entry => byDay.set(entry.day, (byDay.get(entry.day) || 0) + delta(entry)));
        const days = [...byDay.keys()].sort((a, b) => b.localeCompare(a));
        $("history-list").replaceChildren();
        $("history-empty").hidden = days.length > 0;
        days.forEach(day => {
          const li = document.createElement("li");
          li.className = "row";
          const date = document.createElement("span");
          date.className = "row-title";
          date.textContent = historyFormatter.format(parseDay(day));
          const total = document.createElement("span");
          total.className = `history-total${byDay.get(day) < 0 ? " negative" : ""}`;
          total.textContent = `${numberFormatter.format(byDay.get(day))} kcal`;
          li.append(date, total);
          $("history-list").append(li);
        });
        $("entries-list").scrollTop = entriesScroll;
        $("history-list").scrollTop = historyScroll;
      }

      $("multiplier").addEventListener("click", () => {
        $("multiplier-input").value = String(multiplier);
        $("multiplier-feedback").textContent = "";
        updateStepButtons();
        $("multiplier-dialog").showModal();
        $("multiplier-input").focus();
        $("multiplier-input").select();
      });
      $("multiplier-up").addEventListener("click", () => adjustMultiplier(1));
      $("multiplier-down").addEventListener("click", () => adjustMultiplier(-1));
      $("multiplier-input").addEventListener("input", updateStepButtons);
      $("multiplier-cancel").addEventListener("click", () => $("multiplier-dialog").close());
      $("multiplier-form").addEventListener("submit", event => {
        event.preventDefault();
        const value = parseMultiplier($("multiplier-input").value);
        if (!validMultiplier(value)) {
          $("multiplier-feedback").textContent = "Enter a positive number, such as 0.3, 0.6, 4, or 10.";
          return;
        }
        multiplier = value;
        updateMultiplier();
        $("multiplier-dialog").close();
        $("kcal-input").focus();
      });
      $("kcal-input").addEventListener("input", updateMultiplier);
      $("entry-form").addEventListener("submit", async event => {
        event.preventDefault();
        if (busy) return;
        const kcal = Number($("kcal-input").value);
        if (!Number.isInteger(kcal) || kcal < 1 || kcal > 100000) { $("feedback").textContent = "Enter a whole number from 1 to 100,000 kcal."; return; }
        const operation = event.submitter?.dataset.operation || "add";
        busy = true;
        setEnabled(false);
        try {
          entries = (await api("/api/entries", { method: "POST", body: JSON.stringify({ day: localDay(), kcal, multiplier, operation }) })).entries;
          $("feedback").textContent = "";
          $("kcal-input").value = "";
          multiplier = 1;
          updateMultiplier();
          render();
          $("entries-list").scrollTop = 0;
        } catch (error) {
          $("feedback").textContent = error.message;
        } finally {
          busy = false;
          setEnabled(true);
          $("kcal-input").focus();
        }
      });

      async function load() {
        if (fileMode) {
          $("file-warning").hidden = false;
          setEnabled(false);
        } else {
          try {
            entries = (await api("/api/entries")).entries;
            setEnabled(true);
            $("feedback").textContent = "";
          } catch (error) {
            $("feedback").textContent = error.message;
            setEnabled(false);
          }
        }
        render();
      }
      updateMultiplier();
      load();
      window.addEventListener("focus", load);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
      setInterval(render, 60000);
    })();
  </script>
</body>
</html>
